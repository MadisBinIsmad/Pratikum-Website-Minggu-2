<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container-fluid text-center">
      <div class="row align-items-start">
        <div class="col-12 col-md-8 bg-success">One of three columns</div>
        <div class="col-6 col-md-4 bg-info">One of three columns</div>
        <div class="col bg-warning">One of three columns</div>
      </div>
    </div>

    <div
      class="container overflow-hidden text-center mb-12"
      style="margin-top: 21px"
    >
      <div class="row gy-5 gx-5">
        <div class="col-6 bg-danger">
          <div class="p-3 bg-light">Custom column padding</div>
        </div>
        <div class="col-6 bg-info">
          <div class="p-3 bg-black">Custom column padding</div>
        </div>
        <div class="col-6 bg-warning">
          <div class="p-3 bg-danger">Custom column padding</div>
        </div>
        <div class="col-6 bg-success">
          <div class="p-3 bg-info">Custom column padding</div>
        </div>
      </div>
    </div>

    <div class="container">
      <table
        class="table table-hover table-striped table-bordered"
        style="margin-top: 21px"
      >
        <thead>
          <tr class="table-dark">
            <th scope="col">#</th>
            <th scope="col">First</th>
            <th scope="col">Last</th>
            <th scope="col">Handle</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row">1</th>
            <td>Mark</td>
            <td>Otto</td>
            <td>@mdo</td>
          </tr>
          <tr>
            <th scope="row">2</th>
            <td>Jacob</td>
            <td>Thornton</td>
            <td>@fat</td>
          </tr>
          <tr>
            <th scope="row">3</th>
            <td>John</td>
            <td>Doe</td>
            <td>@social</td>
          </tr>
        </tbody>
      </table>
    </div>

    <section style="margin-top: 21px; align-items: center; text-align: center">
      <div class="container border-black bg-container text-center">
        <button type="button" class="btn btn-primary">Primary</button>
        <button type="button" class="btn btn-secondary">Secondary</button>
        <button type="button" class="btn btn-success">Success</button>
        <button type="button" class="btn btn-danger">Danger</button>
        <button type="button" class="btn btn-warning">Warning</button>
        <button type="button" class="btn btn-info">Info</button>
        <button type="button" class="btn btn-light">Light</button>
        <button type="button" class="btn btn-dark">Dark</button>

        <button type="button" class="btn btn-link">Link</button>
      </div>
    </section>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
